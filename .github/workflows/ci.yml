name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          enable-cache: true
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Sync environment
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Run fast tests
        run: uv run --python ${{ matrix.python-version }} pytest -m "not engine"

  engine-tests:
    name: Fairy-Stockfish integration tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.14
      - name: Sync environment
        run: uv sync --locked --python 3.14
      - name: Run engine tests
        env:
          GITHUB_API_TOKEN: ${{ github.token }}
        run: uv run --python 3.14 pytest -m engine

  quality:
    name: Ruff, Pyright, and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.14
      - name: Sync environment
        run: uv sync --locked --python 3.14
      - name: Check lockfile
        run: uv lock --check --python 3.14
      - name: Ruff lint
        run: uv run --python 3.14 ruff check .
      - name: Ruff format
        run: uv run --python 3.14 ruff format --check .
      - name: Pyright
        run: uv run --python 3.14 pyright
      - name: Build distributions
        run: uv build --python 3.14
